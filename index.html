<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Buchkantine Stock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login -->
  <section id="view-login" class="view center" hidden>
    <form id="login-form" class="panel">
      <div class="logo">📦</div>
      <h1>Buchkantine Stock</h1>
      <input type="text" name="username" autocomplete="username" hidden>
      <input id="login-password" type="password" placeholder="Team password" autocomplete="current-password" required>
      <button class="primary" type="submit">Log in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- First name, once per device -->
  <section id="view-name" class="view center" hidden>
    <form id="name-form" class="panel">
      <div class="logo">👋</div>
      <h1>What's your first name?</h1>
      <p class="muted">It's shown next to the counts you log. Asked once on this phone.</p>
      <input id="name-input" type="text" placeholder="First name" autocomplete="given-name" required>
      <button class="primary" type="submit">Continue</button>
    </form>
  </section>

  <!-- Main: Ingredients / Production -->
  <section id="view-main" class="view" hidden>
    <header class="top">
      <div class="bar">
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="ingredient" role="tab">Ingredients<span class="badge" hidden></span></button>
          <button class="tab" data-tab="production" role="tab">Production<span class="badge" hidden></span></button>
        </div>
        <button id="open-settings" class="icon" aria-label="Settings">⚙️</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search items" autocomplete="off">
      <div id="chips" class="chips"></div>
    </header>
    <main id="list" class="list"></main>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view" hidden>
    <header class="top">
      <div class="bar">
        <button id="close-settings" class="back">‹ Back</button>
        <h2>Settings</h2>
        <span class="spacer"></span>
      </div>
      <input id="settings-search" class="search" type="search" placeholder="Search items" autocomplete="off">
    </header>
    <main class="list">
      <div class="card settings-me">
        <div>Counting as <b id="me-name"></b></div>
        <div class="row-actions">
          <button id="change-name" class="link">Change name</button>
          <button id="logout" class="link">Log out</button>
        </div>
      </div>
      <p class="muted small">Minimums and units for every item. Changes save automatically.</p>
      <div id="settings-list"></div>
    </main>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
